
name: Checkout Three Tier Architecture

on:
  workflow_dispatch:

jobs:
  checkout:
    runs-on: self-hosted

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: iam-veeramalla/three-tier-architecture-demo
          ref: main
          path: three-tier-demo

      - name: Verify downloaded repository
        run: |
          echo "Repository downloaded successfully"
          echo "Current directory:"
          pwd
          echo "Repository contents:"
          ls -la three-tier-demo

      - name: Display project files
        run: |
          find three-tier-demo -maxdepth 2 -type f
