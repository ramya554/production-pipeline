
name: Checkout Code to Self Hosted Runner

on:
  workflow_dispatch:

jobs:
  checkout:
    runs-on: self-hosted

    steps:
      - name: Checkout another GitHub repository
        uses: actions/checkout@v4
        with:
          repository: iam-veeramalla/three-tier-architecture-demo
          ref: main
          path: three-tier-demo

      - name: Verify downloaded code
        run: |
          echo "Code downloaded successfully!"
          echo "Runner hostname:"
          hostname
          echo "Downloaded files:"
          ls -la three-tier-demo

      - name: Display project structure
        run: |
          find three-tier-demo -maxdepth 2 -type f
